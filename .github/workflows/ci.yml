name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: bash scripts/install-linux-deps-debian.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo check
      - run: cargo test

  windows-nsis:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build NSIS installer
        run: npm run build:windows

      - name: Assert NSIS installer exists
        shell: bash
        run: |
          shopt -s nullglob
          exe=(target/release/bundle/nsis/*.exe)
          if (( ${#exe[@]} != 1 )); then
            echo "expected one NSIS installer, found ${#exe[@]}" >&2
            ls -la target/release/bundle/nsis || true
            exit 1
          fi
          echo "nsis=${exe[0]}"

      - name: Silent-install and launch
        shell: pwsh
        run: ./scripts/windows-nsis-smoke.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
