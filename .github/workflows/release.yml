name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Build Windows packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build:windows

      - name: Stage Windows packages
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          nsis=(target/release/bundle/nsis/*-setup.exe)
          sig=(target/release/bundle/nsis/*-setup.exe.sig)
          if (( ${#nsis[@]} != 1 || ${#sig[@]} != 1 )); then
            echo "Expected one NSIS installer and .exe.sig (Tauri 2 updater artifacts)" >&2
            ls -la target/release/bundle/nsis || true
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${nsis[0]}" "${sig[0]}" release-artifacts/

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(awk '/^\[workspace.package\]/{f=1} f && /^version = /{gsub(/"/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$TAG" != "$CONF" ] || [ "$TAG" != "$PKG" ] || [ "$TAG" != "$CARGO" ]; then
            echo "Tag v$TAG does not match package.json ($PKG), Cargo.toml ($CARGO), or tauri.conf.json ($CONF)"
            exit 1
          fi
          node - "$TAG" <<'NODE'
          const { readFileSync } = require("node:fs");
          const version = process.argv[2];
          const escaped = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const heading = new RegExp(
            `^## \\[${escaped}\\](?: - \\d{4}-\\d{2}-\\d{2})?$`,
            "m",
          );
          if (!heading.test(readFileSync("CHANGELOG.md", "utf8"))) {
            console.error(`CHANGELOG.md has no valid release section for ${version}`);
            process.exit(1);
          }
          NODE

      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: release-artifacts/windows

      - name: Build latest.json and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          BASE="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}"

          WIN_EXE=$(find release-artifacts/windows -maxdepth 1 -type f -name '*-setup.exe' -print -quit)
          WIN_SIG=$(find release-artifacts/windows -maxdepth 1 -type f -name '*-setup.exe.sig' -print -quit)

          test -n "$WIN_EXE" && test -n "$WIN_SIG"

          WIN_EXE_NAME=$(basename "$WIN_EXE")

          VERSION="$VERSION" \
          WIN_SIG="$WIN_SIG" \
          WIN_URL="${BASE}/${WIN_EXE_NAME}" \
          node <<'NODE'
          const fs = require("fs");
          fs.writeFileSync(
            "latest.json",
            JSON.stringify(
              {
                version: process.env.VERSION,
                notes: `MonoCode ${process.env.VERSION}`,
                pub_date: new Date().toISOString(),
                platforms: {
                  "windows-x86_64": {
                    signature: fs.readFileSync(process.env.WIN_SIG, "utf8").trim(),
                    url: process.env.WIN_URL,
                  },
                },
              },
              null,
              2,
            ) + "\n",
          );
          NODE

          gh release create "$GITHUB_REF_NAME" \
            --title "MonoCode $VERSION" \
            --notes "See CHANGELOG.md for details. In-app updates use latest.json on this release." \
            "$WIN_EXE" "$WIN_SIG" \
            latest.json
