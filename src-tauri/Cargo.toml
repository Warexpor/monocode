[package]
name = "monocode"
version.workspace = true
edition.workspace = true
description = "MonoCode — one UI for every agent harness"
authors = ["Nick"]
repository = "https://github.com/Warexpor/monocode"
homepage = "https://github.com/Warexpor/monocode"
license.workspace = true

[lib]
name = "monocode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
tauri-plugin-dialog = "2"
rodio = { version = "0.20", features = ["symphonia-all"] }
rusqlite = { version = "0.40.2", features = ["bundled"], default-features = false }
ureq = { version = "2.12.1", default-features = false, features = ["tls", "gzip"] }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(target_os = "windows")'.dependencies]
notify-rust = "4.18"
portable-pty = "0.9"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
